server:
  port: 8080

spring:
  application:
    name: orchestrator-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orchestrator}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

grpc:
  client:
    agent-execution:
      address: dns:///${AGENT_EXECUTION_GRPC_HOST:localhost}:${AGENT_EXECUTION_GRPC_PORT:9090}
      negotiation-type: plaintext

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expiration-ms: 86400000

resilience4j:
  retry:
    instances:
      llm-call:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
