services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orchestrator}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  orchestrator-service:
    build:
      context: .
      dockerfile: orchestrator-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orchestrator
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-orchestrator}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-orchestrator}
      SPRING_DATA_REDIS_HOST: redis
      AGENT_EXECUTION_GRPC_HOST: agent-execution-service
      AGENT_EXECUTION_GRPC_PORT: 9090
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent-execution-service:
    build:
      context: .
      dockerfile: agent-execution-service/Dockerfile
    ports:
      - "9090:9090"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      PORTKEY_API_KEY: ${PORTKEY_API_KEY}
      PORTKEY_BASE_URL: ${PORTKEY_BASE_URL:-https://api.portkey.ai/v1}
      PORTKEY_PROVIDER: ${PORTKEY_PROVIDER:-@aws-bedrock-use2}
      PORTKEY_DEFAULT_MODEL: ${PORTKEY_DEFAULT_MODEL:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      PORTKEY_STRONG_MODEL: ${PORTKEY_STRONG_MODEL:-us.anthropic.claude-sonnet-4-6}
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - orchestrator-service

volumes:
  postgres-data:
