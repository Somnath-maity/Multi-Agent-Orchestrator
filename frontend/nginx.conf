server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ─────────────────────────────
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # ── Static assets with caching ───────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SSE endpoints (no buffering, no caching) ─────
    location ~ ^/api/(.*/events)$ {
        proxy_pass http://orchestrator-service:8080/$1;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';

        # Disable all buffering for SSE
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # No timeouts on long-lived SSE connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Accel-Buffering "no";
    }

    # ── API proxy (strips /api prefix) ─────────────
    location /api/ {
        proxy_pass http://orchestrator-service:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── SPA fallback ─────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
